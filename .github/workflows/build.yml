name: Build Muse Link (installer)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Release run (build, zip, publish release automatically)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore package-lock.json from base64 chunks
        shell: pwsh
        run: |
          $b64 = (Get-ChildItem 'package-lock.b64.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('package-lock.json', [Convert]::FromBase64String($b64))

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore icons from base64
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('assets/icon.ico', [Convert]::FromBase64String((Get-Content 'assets/icon.ico.b64' -Raw)))
          [IO.File]::WriteAllBytes('assets/icon.png', [Convert]::FromBase64String((Get-Content 'assets/icon.png.b64' -Raw)))

      - name: Install dependencies
        run: npm ci

      - name: Build installer (normal build)
        if: ${{ !inputs.release }}
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer artifact (normal build)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: link-installer
          path: dist/Muse-Link-Setup-*.exe
          if-no-files-found: error

      - name: Build installer (release run)
        if: ${{ inputs.release }}
        run: npx electron-builder --win nsis --publish never

      - name: Zip the setup and publish the release (release run)
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          Compress-Archive -Path "dist/Muse-Link-Setup-$v.exe" -DestinationPath "dist/Muse-Link-Setup-$v.zip" -Force
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/Muse-Link-Setup-$v.zip" "dist/link.yml" --clobber
            gh release edit $tag --title "Muse Link v$v" --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag --title "Muse Link v$v" --notes-file RELEASE_NOTES.md "dist/Muse-Link-Setup-$v.zip" "dist/link.yml"
          }
