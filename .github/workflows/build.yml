name: Build Muse Link (installer)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Release run (build, create draft, publish automatically)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore package-lock.json from base64 chunks
        shell: pwsh
        run: |
          $b64 = (Get-ChildItem 'package-lock.b64.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('package-lock.json', [Convert]::FromBase64String($b64))

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore icons from base64
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('assets/icon.ico', [Convert]::FromBase64String((Get-Content 'assets/icon.ico.b64' -Raw)))
          [IO.File]::WriteAllBytes('assets/icon.png', [Convert]::FromBase64String((Get-Content 'assets/icon.png.b64' -Raw)))

      - name: Install dependencies
        run: npm ci

      - name: Build installer (normal build)
        if: ${{ !inputs.release }}
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer artifact (normal build)
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: link-installer
          path: dist/Muse-Link-Setup-*.exe
          if-no-files-found: error

      - name: Build installer and create release draft (release run)
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Publish the release (release run)
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $rel = gh api "repos/${{ github.repository }}/releases" | ConvertFrom-Json | Where-Object { $_.tag_name -eq "v$v" -and $_.draft } | Select-Object -First 1
          if (-not $rel) { throw "draft release v$v not found" }
          gh api -X PATCH "repos/${{ github.repository }}/releases/$($rel.id)" -F draft=false -f target_commitish="$env:GITHUB_SHA"
